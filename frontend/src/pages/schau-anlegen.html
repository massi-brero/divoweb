<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DivoWeb – Schau anlegen</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="stylesheet" href="../styles/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="../index.html" aria-label="DivoWeb Startseite">
        <img class="brand__logo" src="../assets/images/vogel.png" alt="Wellensittich Logo" />
        <div class="brand__text">
          <span class="brand__divo">Divo</span><span class="brand__web">Web</span>
        </div>
      </a>

      <nav class="main-nav" aria-label="Hauptnavigation">
        <a class="nav-link is-active" href="schau-anlegen.html">Schau anlegen</a>
        <div class="nav-dropdown">
          <button class="nav-link nav-dropdown__button" type="button" aria-haspopup="true">
            Vor der Schau
          </button>
          <div class="nav-dropdown__menu">
            <a class="nav-dropdown__item" href="zuechter-voegel.html">Züchter & Vögel anlegen</a>
          </div>
        </div>
        <a class="nav-link" href="#">Showtime</a>
        <a class="nav-link" href="#">Nach der Schau</a>
        <a class="nav-link nav-link--home" href="../index.html" aria-label="Zur Startseite">
          <span class="home-icon">⌂</span>
        </a>
      </nav>
    </div>
    <div class="topbar__accent"></div>
  </header>

  <main class="page">
    <h1 class="page-title">Schau anlegen</h1>

    <section class="panel">
      <form id="showForm" novalidate>
        <div class="panel__grid">
          <div>
            <h2 class="section-title">Schaudaten</h2>

            <div class="form-group">
              <label for="showNumber">Nummer der Schau <span class="required">*</span></label>
              <input id="showNumber" name="showNumber" type="text" autocomplete="off" />
              <p class="field-error" data-error-for="showNumber"></p>
            </div>

            <div class="form-group">
              <label for="showType">Art der Schau <span class="required">*</span></label>
              <select id="showType" name="showType">
                <option value="">Bitte wählen...</option>
                <option value="Landesschau">Landesschau</option>
                <option value="Bundesschau">Bundesschau</option>
                <option value="Vereinsschau">Vereinsschau</option>
                <option value="Europaschau">Europaschau</option>
              </select>
              <p class="field-error" data-error-for="showType"></p>
            </div>

            <div class="form-group">
              <label for="showYear">Jahr der Schau <span class="required">*</span></label>
              <select id="showYear" name="showYear">
                <option value="">Bitte wählen...</option>
              </select>
              <p class="field-error" data-error-for="showYear"></p>
            </div>

            <div class="form-group">
              <label for="showLocation">Ort der Schau <span class="required">*</span></label>
              <input id="showLocation" name="showLocation" type="text" autocomplete="off" />
              <p class="field-error" data-error-for="showLocation"></p>
            </div>

            <div class="form-group">
              <label for="association">Verband / Sparte <span class="required">*</span></label>
              <select id="association" name="association">
                <option value="">Bitte wählen...</option>
                <option value="AZ">AZ</option>
                <option value="DKB">DKB</option>
                <option value="AGZ">AGZ</option>
                <option value="DWV">DWV</option>
              </select>
              <p class="field-error" data-error-for="association"></p>
            </div>

            <div class="form-group">
              <label for="feePerBird">Standgeld pro Vogel <span class="required">*</span></label>
              <div class="input-suffix">
                <input id="feePerBird" name="feePerBird" type="text" inputmode="decimal" autocomplete="off" />
                <span class="input-suffix__text">EUR</span>
              </div>
              <p class="field-error" data-error-for="feePerBird"></p>
            </div>
          </div>

          <div>
            <div class="section-title-row">
              <h2 class="section-title">Preisrichter / Zuchtrichter</h2>
            </div>

            <div id="judgesList" class="judges-list"></div>

            <button id="addJudgeButton" class="add-judge-button" type="button">
              <span class="plus">＋</span> Preisrichter hinzufügen
            </button>
          </div>
        </div>

        <div class="panel__footer">
          <button class="btn btn--primary" type="submit">Schau speichern</button>
          <button id="startManagementButton" class="btn btn--tertiary" type="button">Schauverwaltung starten</button>
          <button id="cancelButton" class="btn btn--secondary" type="button">Abbrechen</button>
          <button id="sampleDataButton" class="btn btn--secondary" type="button">Beispieldaten einfügen</button>
        </div>
      </form>
    </section>
  </main>

  <template id="judgeRowTemplate">
    <div class="judge-card">
      <div class="judge-card__grid">
        <div class="form-group form-group--compact">
          <label>Name</label>
          <input data-judge-field="name" type="text" autocomplete="off" />
        </div>

        <div class="form-group form-group--compact">
          <label>Sparte / Verband</label>
          <select data-judge-field="association">
            <option value="">Bitte wählen...</option>
            <option value="AZ">AZ</option>
            <option value="DKB">DKB</option>
            <option value="AGZ">AGZ</option>
            <option value="DWV">DWV</option>
          </select>
        </div>

        <div class="judge-card__actions">
          <button class="delete-judge-button" type="button" aria-label="Preisrichter entfernen">−</button>
        </div>
      </div>
    </div>
  </template>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="../scripts/schau-anlegen.js"></script>
</body>
</html>
