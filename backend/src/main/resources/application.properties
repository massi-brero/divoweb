# ============================================================
# DivoWin Schauverwaltung – Anwendungskonfiguration
# ============================================================

spring.application.name=divowin-schauverwaltung

# Datenbank (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/divowin
spring.datasource.username=divowin
spring.datasource.password=divowin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Server
server.port=8080
server.servlet.context-path=/api

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.de.divowin=DEBUG
logging.level.org.springframework.security=INFO
