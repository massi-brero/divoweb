# ============================================================
# Entwicklungsprofil ? H2 In-Memory-Datenbank
# Aktivieren: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

# H2 In-Memory-Datenbank (ueberschreibt PostgreSQL aus application.properties)
spring.datasource.url=jdbc:h2:mem:divowin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console im Browser: http://localhost:8080/api/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase laeuft auch gegen H2
spring.liquibase.enabled=true

# Logging
logging.level.de.divowin=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.liquibase=INFO